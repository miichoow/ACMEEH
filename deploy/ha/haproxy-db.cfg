# HAProxy running ON EACH NODE, next to ACMEEH: it routes ACMEEH's database connections to the
# current PostgreSQL primary.  /etc/haproxy/haproxy-db.cfg (second instance, see the systemd
# unit in deploy/ha/haproxy-db.service) or merged into the node's haproxy.cfg.
#
# Why a local proxy rather than a virtual IP or libpq multi-host?
#   * ACMEEH's configuration takes ONE host.  libpq can try several (`host=a,b,c` +
#     `target_session_attrs=read-write`) but ACMEEH does not expose that.
#   * HAProxy asks Patroni (GET /primary) who the primary is, and cuts the sessions of a node
#     the moment it stops being primary (`on-marked-down shutdown-sessions`).
#
# Status: validated on the test cluster (3 nodes, TLS to Patroni REST, TLS passthrough to PostgreSQL).
# The PostgreSQL traffic is NOT decrypted here: TLS runs end to end between ACMEEH and
# PostgreSQL (ACMEEH: `sslmode: verify-full`).  Only the health checks speak HTTPS to Patroni.

global
    log /dev/log local0
    maxconn 1000

defaults
    log     global
    mode    tcp
    retries 2
    timeout connect 3s
    timeout client  30m      # pooled connections stay idle between requests
    timeout server  30m
    timeout check   2s

# ACMEEH connects here.  Bind to loopback ONLY: this port is an unauthenticated door to the
# primary as far as the network is concerned (authentication is PostgreSQL's).
listen pg_rw
    bind 127.0.0.1:5000
    option httpchk GET /primary
    http-check expect status 200
    # inter x fall = how long a dead primary keeps receiving connections: 2 s x 2 = 4 s, which is
    # well below Patroni's own detection time (ttl 30 s), so this is not the bottleneck.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    # check port 8008 check-ssl ... : the HEALTH CHECK is HTTPS to Patroni's REST API and verifies
    # its certificate; `verifyhost`/`check-sni` must match a SAN of that certificate.
    server <NODE1_NAME> <NODE1_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE1_FQDN> check-sni <NODE1_FQDN>
    server <NODE2_NAME> <NODE2_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE2_FQDN> check-sni <NODE2_FQDN>
    server <NODE3_NAME> <NODE3_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE3_FQDN> check-sni <NODE3_FQDN>

# Optional: standbys, read-only (monitoring, reports, replication checks).  ACMEEH does not use it.
listen pg_ro
    bind 127.0.0.1:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server <NODE1_NAME> <NODE1_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE1_FQDN> check-sni <NODE1_FQDN>
    server <NODE2_NAME> <NODE2_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE2_FQDN> check-sni <NODE2_FQDN>
    server <NODE3_NAME> <NODE3_FQDN>:5432 check port 8008 check-ssl ca-file /etc/haproxy/tls/ca.pem verify required verifyhost <NODE3_FQDN> check-sni <NODE3_FQDN>
