# pgBackRest configuration, identical on the 3 PostgreSQL nodes: /etc/pgbackrest/pgbackrest.conf
#
# Replication is NOT a backup: a DELETE or a corrupted row is replicated to every node within
# milliseconds.  Backups + continuous WAL archiving give point-in-time recovery.
#
# Status: see docs/ha-postgres.rst, "Backup and restore" for what was exercised on the test cluster.
#
# The repository must be reachable from all 3 nodes (the primary changes), and survive the loss
# of all 3: put it on S3-compatible object storage, or on a separate backup host / NFS share,
# NOT on a disk of one of the database servers.

[global]
# --- repository (choose one) ---------------------------------------------------------------
# Shared filesystem (NFS) mounted at the same path on every node:
repo1-path=/var/lib/pgbackrest
# S3-compatible storage instead:
#   repo1-type=s3
#   repo1-s3-endpoint=<S3_ENDPOINT>
#   repo1-s3-bucket=<BUCKET>
#   repo1-s3-region=<REGION>
#   repo1-s3-key=<ACCESS_KEY>
#   repo1-s3-key-secret=<SECRET_KEY>
#   repo1-path=/acmeeh

# Encrypt the repository: it contains every certificate, account key and audit record.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<REPO_PASSPHRASE>

# Retention: 2 full backups and 6 differentials; WAL is kept for as long as a backup needs it.
repo1-retention-full=2
repo1-retention-diff=6

compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=detail

[acmeeh]
pg1-path=/var/lib/postgresql/16/main           # Debian/Ubuntu.  RHEL: /var/lib/pgsql/16/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
