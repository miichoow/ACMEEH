# keepalived: ONE virtual IP in front of the load balancers, for sites without an enterprise
# load balancer.  Run HAProxy (haproxy-lb.cfg) + keepalived on the same machines.
#
# STATUS: NOT validated on the test cluster (VRRP does not run across docker bridge networks).
# Validate on your servers: stop haproxy on the MASTER, then power it off, and watch the VIP move.
#
# Note: a VIP gives ACTIVE/PASSIVE at the network level (one machine receives the traffic).
# That is enough for ACMEEH; the ACMEEH instances behind it are all active (the load balancer
# spreads across the 3).  Use an external load balancer if you need to spread the TLS work.

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    fall 2
    rise 2
}

vrrp_instance ACMEEH_VIP {
    state BACKUP                  # same on all: priority decides the master (avoids flapping on restart)
    interface <INTERFACE>         # for example eth0 / ens192
    virtual_router_id 51          # unique on the L2 segment
    priority <PRIORITY>           # [node] 150 / 100 / 90
    advert_int 1
    nopreempt                     # do not take the VIP back when a former master returns
    authentication {
        auth_type PASS
        auth_pass <VRRP_SECRET>   # max 8 characters; VRRP is not encrypted, isolate the VLAN
    }
    virtual_ipaddress {
        <VIP>/<PREFIX>
    }
    track_script {
        chk_haproxy
    }
}
