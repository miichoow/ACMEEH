# Load balancer in front of the ACMEEH instances.
#
# If your organisation already has a load balancer (F5, NetScaler, Avi, cloud LB...), do NOT
# deploy this: apply the same SETTINGS to it (they are the part that was tuned and measured):
#   * terminate TLS there (ACME clients require HTTPS);
#   * health check:  GET /readyz  expecting 200, interval 2 s, timeout 3 s, 4 consecutive failures
#     to take an instance out, 1 success to bring it back;
#   * NEVER replay a request on another instance after a 5xx or a reset;
#   * pass X-Forwarded-For and X-Forwarded-Proto: https, and list the balancer in
#     ACMEEH's `proxy.trusted_proxies`.
#
# Status: validated on the test cluster (HAProxy 2.9, TLS termination, 3 backends).  The virtual IP
# (keepalived.conf) is NOT validated on the test cluster.

global
    log /dev/log local0
    maxconn 2000
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 3s
    timeout client  60s
    timeout server  60s
    timeout check   3s

frontend acme
    bind *:443 ssl crt /etc/haproxy/tls/acme.pem alpn http/1.1   # cert + key + chain in one PEM
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend acmeeh

backend acmeeh
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200

    # Retry only when the connection could not even be opened (the request was never sent).
    # Do NOT add 503 / empty-response / all-retryable-errors: an ACME POST carries a single-use
    # nonce.  Replaying it elsewhere yields `badNonce` (400) and multiplies the load during an
    # incident.  The ACME client retries, with a fresh nonce.   [measured: replay on 503 turned
    # a 5 s database outage into hundreds of failed requests]
    retry-on conn-failure
    retries 2
    option redispatch

    # An instance leaves rotation after fall x inter = 4 x 2 s = 8 s of failed checks and returns
    # after ONE success.  8 s is longer than a planned database switchover (~5 s), so a switchover
    # does not empty the pool.  [measured: 0 empty pool in 3/3 switchovers; with fall 2 rise 2
    # every switchover removed instances, and 51 to 88 requests got HAProxy's own 503]
    default-server inter 2s fall 4 rise 1
    server acmeeh1 <ACMEEH1_FQDN>:8443 check
    server acmeeh2 <ACMEEH2_FQDN>:8443 check
    server acmeeh3 <ACMEEH3_FQDN>:8443 check

frontend stats
    bind 127.0.0.1:7000
    stats enable
    stats uri /
    stats refresh 5s
